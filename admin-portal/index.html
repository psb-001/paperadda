<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperAdda Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">P</div>
        <div>
          <div class="brand-name">PaperAdda</div>
          <div class="brand-sub">Admin</div>
        </div>
      </div>

      <nav class="nav" id="mainNav">
        <button class="nav-item active" data-view="dashboard">
          <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9zm0 7h6v-5H4v5zm10 0h6v-9h-6v9zm0-16v5h6V4h-6z"/></svg>
          <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-view="papers">
          <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg>
          <span class="nav-label">Papers</span>
        </button>
        <button class="nav-item" data-view="notes">
          <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h12v-2H3v2zm0-5h12v-2H3v2zm0-7v2h18V6H3zm18 13H3v-2h18v2z"/></svg>
          <span class="nav-label">Notes</span>
        </button>
        <button class="nav-item" data-view="subjects">
          <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
          <span class="nav-label">Subjects</span>
        </button>
        <button class="nav-item" data-view="data">
          <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
          <span class="nav-label">Settings</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="pill" id="connPill">● Cloud connected</div>
        <p id="adminEmail" class="muted"></p>
        <button class="btn text-btn" id="btnLogout">Log out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Home</h1>
          <p id="viewSubtitle">Upload once — students see it instantly</p>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>

      <section class="view active" id="view-dashboard"></section>
      <section class="view" id="view-papers"></section>
      <section class="view" id="view-notes"></section>
      <section class="view" id="view-subjects"></section>
      <section class="view" id="view-data"></section>
    </main>
  </div>

  <div class="login-backdrop" id="loginBackdrop" hidden>
    <div class="login-card">
      <div class="brand-icon login-logo">P</div>
      <h2>PaperAdda Admin</h2>
      <p class="muted">Sign in to publish papers &amp; notes.</p>
      <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" placeholder="you@example.com" /></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" /></div>
      <p class="hint" id="loginError" style="color:var(--error);min-height:18px"></p>
      <button class="btn filled tonal-elev" id="btnLogin">Sign in</button>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle">Modal</h2>
        <button class="icon-btn" id="modalClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>
  <div class="toast-wrap" id="toastWrap"></div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
